theme = "fleet_transparent"

[editor]
cursorline = true
true-color = true
color-modes = true
line-number = "relative"
bufferline = { render-mode = "multiple", separator = "" }
gutters = { layout = [
  "line-numbers",
  "diff",
  "diagnostics",
  "spacer",
], line-numbers = { same-color = true } }

soft-wrap = { enable = true }
file-picker = { hidden = false }

completion-highlight = { highlight-type = "theme-colors" }
inline-blame = { show = "cursor-line", auto-fetch = true }
inline-diagnostics = { cursor-line = "hint", show-virtual-lines = true }
notifications = { shadow = { enable = false } }

[editor.lsp]
display-inlay-hints = true
signature-help-position = "below"

[editor.persistence]
old-files = true
commands = true
search = true
clipboard = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
separator = "|"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
left = [
  "mode",
  "spacer",
  "spacer",
  "version-control",
  "spacer",
  "diagnostics",
  "separator",
  "file-name",
  "file-modification-indicator",
]
right = [
  "spinner",
  "register",
  "spacer",
  "separator",
  "position",
  "position-percentage",
  "file-type",
]


[keys.normal.space]
m = [
  ':insert-output leaf "$(echo %{buffer_name} | sed "s|^~|$HOME|")" >/dev/tty',
  ':redraw',
]
y = [
  ':sh rm -f /tmp/helix-yazi-chooser',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/helix-yazi-chooser',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/helix-yazi-chooser}',
  ':redraw',
  ':set mouse false',
  ':set mouse true',
]
