# C++
[[language]]
name = "cpp"
indent = { tab-width = 4, unit = "    " }

# CMake
[[language]]
name = "cmake"
language-servers = ["neocmakelsp"]

# Rust
[[language]]
name = "rust"
indent = { tab-width = 4, unit = "    " }

# Go
[[language]]
name = "go"
indent = { tab-width = 4, unit = "    " }
language-servers = ["gopls"]

# Python
[[language]]
name = "python"
indent = { tab-width = 4, unit = "    " }
language-servers = [
  "pyright",
  { name = "ruff", only-features = [
    "diagnostics",
    "code-action",
    "format",
  ] },
]

# Bash
[[language]]
name = "bash"
indent = { tab-width = 4, unit = "    " }

# JSON
[[language]]
name = "json"
indent = { tab-width = 2, unit = "    " }

# TOML
[[language]]
name = "toml"
indent = { tab-width = 4, unit = "    " }
language-servers = ["taplo"]
formatter = { command = "taplo", args = ["fmt", "-"] }

# LSP
[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.ruff]
command = "ruff"
args = ["server"]
