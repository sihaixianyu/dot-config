# Forest Light
# Based on Everforest (Light Medium) — no italics, dimmer inline-blame
inherits = "everforest_light"

# No italics anywhere
"constant.builtin" = { fg = "purple" }
"comment" = { fg = "grey1" }
"variable.builtin" = { fg = "purple" }
"namespace" = { fg = "yellow" }
"attribute" = { fg = "purple" }
"markup.italic" = { modifiers = [] }

# Inline blame: dark grey-green instead of the default bright fg
"ui.virtual.inline-blame" = { fg = "#6f7d70" }

# Popup / picker frames. Pickers clear their area with `ui.background` and draw the
# border with no style of its own, so the border color comes from this fg.
"ui.background" = { fg = "#708089", bg = "bg0" }
"ui.popup.border" = { fg = "#708089" }
