# General
inherits = "onedark"

# Base
"ui.background" = { bg = "default" }
"ui.window" = { fg = "gray" }
"ui.statusline" = { fg = "white", bg = "default" }
"ui.statusline.inactive" = { fg = "light-gray", bg = "default" }
"ui.statusline.normal" = { fg = "#202124", bg = "#A8C7A0", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "#202124", bg = "#82AAFF", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "#202124", bg = "#FFCB6B", modifiers = ["bold"] }

# Bufferline
"ui.bufferline" = { fg = "light-gray", bg = "default" }
"ui.bufferline.active" = { fg = "blue", bg = "default", modifiers = ["bold"] }
"ui.bufferline.background" = { bg = "default" }

# Popup
"ui.popup" = { fg = "white", bg = "default" }
"ui.popup.explorer" = { fg = "white", bg = "default" }
"ui.popup.border" = { fg = "white", bg = "default" }

# Gutter
"ui.linenr" = { fg = "#7f8b99" }
"ui.linenr.normal" = { fg = "#A8C7A0", modifiers = ["bold"] }
"ui.linenr.insert" = { fg = "#82AAFF", modifiers = ["bold"] }
"ui.linenr.select" = { fg = "#FFCB6B", modifiers = ["bold"] }

# Virtual
"ui.virtual.inline-blame" = { fg = "#8b96a8" }
"ui.virtual.inlay-hint" = { fg = "#9aa5b5" }

# Markup
"markup.italic" = { modifiers = [] }
