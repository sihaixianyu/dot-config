# General
inherits = "fleet_dark"

# Base
"ui.background" = {}
"ui.window" = { fg = "#536273" }
"ui.statusline" = { bg = "default" }
"ui.statusline.normal" = { fg = "#202124", bg = "#A8C7A0", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "#202124", bg = "#82AAFF", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "#202124", bg = "#FFCB6B", modifiers = ["bold"] }
"ui.popup.explorer" = { fg = "Gray 120", bg = "default" }

# Popup
"ui.popup" = { bg = "default" }
"ui.popup.border" = { fg = "#ffffff", bg = "default" }

# Gutter
"ui.linenr" = { fg = "#7f8b99" }
"ui.linenr.normal" = { fg = "#A8C7A0", modifiers = ["bold"] }
"ui.linenr.insert" = { fg = "#82AAFF", modifiers = ["bold"] }
"ui.linenr.select" = { fg = "#FFCB6B", modifiers = ["bold"] }

# Selection
"ui.selection" = { bg = "#31455f" }
"ui.selection.primary" = { bg = "#3b5b7d" }

# Cursorline
"ui.cursorline" = { bg = "#303133" }
"ui.cursorline.primary" = { bg = "#383a3d" }
"ui.cursorline.secondary" = { bg = "#303133" }

# Markup
"markup.italic" = { modifiers = [] }
"markup.link.url" = { modifiers = ["underlined"] }
