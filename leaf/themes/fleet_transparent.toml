# Fleet Transparent for Leaf
# Based on ~/.config/helix/themes/fleet_transparent.toml and Fleet Dark.
# "reset" uses the terminal's default background, preserving transparency.
# Leaf supports built-in syntax themes rather than Helix syntax scopes.
base = "ocean"
syntax = "base16-eighties.dark"

[ui]
content_bg = "reset"
toc_bg = "reset"
toc_border = "#536273"
scrollbar_hover = "#82AAFF"

# Transparent status bar with Fleet's blue, green, and yellow accents.
status_bg = "reset"
status_separator = "#536273"
status_brand_fg = "#82AAFF"
status_brand_bg = "reset"
status_filename_fg = "#D1D1D1"
status_filename_bg = "reset"
status_watch_fg = "#C3E88D"
status_watch_bg = "reset"
status_reloaded_fg = "#C3E88D"
status_reloaded_bg = "reset"
status_search_fg = "#FFCB6B"
status_search_bg = "reset"
status_success_fg = "#C3E88D"
status_success_bg = "reset"
status_warning_fg = "#FFCB6B"
status_error_fg = "#FF5269"
status_error_bg = "reset"
status_shortcut_fg = "#7F8B99"
status_percent_fg = "#82AAFF"
status_dot_fg = "#536273"

# Sidebar selection follows Helix's primary selection and cursorline.
toc_hover_fg = "#FFFFFF"
toc_header_fg = "#7F8B99"
toc_active_bg = "#3B5B7D"
toc_inactive_bg = "reset"
toc_accent = "#82AAFF"
toc_index_inactive = "#7F8B99"
toc_primary_active = "#FFFFFF"
toc_primary_inactive = "#D1D1D1"
toc_secondary_inactive = "#7F8B99"
toc_secondary_text_active = "#D1D1D1"
toc_secondary_text_inactive = "#898989"

[markdown]
text = "#D1D1D1"
strong_text = "#EFEFEF"
heading_1 = "#82D2CE"
heading_2 = "#82D2CE"
heading_3 = "#82D2CE"
heading_4 = "#82D2CE"
heading_other = "#82D2CE"
heading_underline = "#536273"

list_level_1 = "#82D2CE"
list_level_2 = "#82D2CE"
list_level_3 = "#82D2CE"
ordered_list = "#82D2CE"
task_checked = "#C3E88D"
task_unchecked = "#7F8B99"

code_gutter = "#7F8B99"
code_frame = "#536273"
code_label = "#E394DC"
inline_code_fg = "#82D2CE"
inline_code_bg = "reset"

link_icon = "#82D2CE"
link_text = "#82D2CE"
link_hover = "#ADD1DE"
footnote_ref = "#C07BF3"
footnote_text = "#D1D1D1"
blockquote_marker = "#536273"
blockquote_text = "#E394DC"

table_border = "#536273"
table_separator = "#536273"
table_header = "#82D2CE"
table_cell = "#D1D1D1"
rule = "#536273"

# Muted blue search highlights keep light text legible.
search_highlight_bg = "#31455F"
search_match_bg = "#3B5B7D"
mark_fg = "#FFCB6B"
mark_bg = "#303133"

latex_inline_fg = "#AF9CFF"
latex_inline_bg = "reset"
latex_block_fg = "#AF9CFF"
mermaid_keyword = "#82D2CE"
mermaid_arrow = "#87C3FF"
mermaid_label = "#EBC88D"
mermaid_block_fg = "#D1D1D1"

alert_note = "#87C3FF"
alert_tip = "#C3E88D"
alert_important = "#AF9CFF"
alert_warning = "#FFCB6B"
alert_caution = "#FF5269"

[diff]
add_fg = "#4CA988"
add_bg = "#081F19"
del_fg = "#CE364D"
del_bg = "#390813"
context_fg = "#D1D1D1"
hunk_header_fg = "#82D2CE"
filename_fg = "#87C3FF"
frame_fg = "#536273"
tree_active = "#82AAFF"
intra_add = "#134939"
intra_del = "#761B2D"
meta_note_fg = "#898989"
meta_note_bg = "reset"
meta_note_sigil_fg = "#7F8B99"
file_separator_fg = "#D1D1D1"
tree_tag_change = "#EBC88D"
tree_tag_renamed = "#87C3FF"
